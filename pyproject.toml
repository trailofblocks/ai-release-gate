[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-release-gate"
version = "1.0.0"
description = "Replay refund-triage evaluations and block regressions in CI."
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
ai-release-gate = "release_gate.cli:main"

[tool.setuptools.packages.find]
include = ["release_gate"]

[tool.setuptools.package-data]
release_gate = ["examples/*.json", "examples/*.jsonl", "examples/agents/*.json"]
